services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rickmorty-api
    
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000

    # Instala também o Nodemon e inicia o modo de desenvolvimento
    command: sh -c "npm ci --include=dev && npm run dev -- --legacy-watch"

    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

    restart: unless-stopped

    networks:
      - app-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node_modules:

networks:
  app-network:
    driver: bridge